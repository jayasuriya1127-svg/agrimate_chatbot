<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgriMate — Agriculture Study Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Karla:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --field-bg: #ded3b3;
    --paper: #faf6ea;
    --furrow: #e4dcc4;
    --soil: #3f3226;
    --soil-soft: #7d6e57;
    --leaf: #4c7a3d;
    --leaf-deep: #33552a;
    --wheat: #b98a1f;
    --user-bg: #3f3226;
    --user-fg: #f6f2e4;
    --error: #9c3b2e;
    --radius: 5px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--field-bg);
    font-family: "Karla", sans-serif;
    color: var(--soil);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .plot {
    width: 100%;
    max-width: 660px;
    height: min(870px, 92vh);
    background: var(--paper);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 0 rgba(63, 50, 38, 0.06), 0 22px 46px -26px rgba(63, 50, 38, 0.45);
  }

  header {
    background: var(--soil);
    color: var(--user-fg);
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .badge {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--leaf);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .badge svg {
    width: 24px;
    height: 24px;
  }

  header .titles h1 {
    font-family: "Zilla Slab", serif;
    font-weight: 700;
    font-size: 23px;
    margin: 0 0 2px;
  }

  header .titles p {
    margin: 0;
    font-size: 12.5px;
    color: #cfc6b2;
  }

  .intro-strip {
    background: var(--wheat);
    color: var(--soil);
    font-size: 12.5px;
    padding: 8px 28px;
    line-height: 1.5;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 28px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 39px,
      var(--furrow) 40px
    );
  }

  .msg {
    max-width: 90%;
    margin-bottom: 16px;
    line-height: 1.6;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: sprout 0.25s ease;
  }

  @keyframes sprout {
    from {
      opacity: 0;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .msg.bot {
    display: flex;
    gap: 10px;
  }

  .msg.bot .leaf-mark {
    flex-shrink: 0;
    margin-top: 3px;
  }

  .msg.bot .leaf-mark svg {
    width: 16px;
    height: 16px;
  }

  .msg.bot .bubble {
    background: var(--furrow);
    padding: 10px 14px;
    border-radius: var(--radius);
    color: var(--soil);
  }

  .msg.user {
    margin-left: auto;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--user-fg);
    padding: 10px 14px;
    border-radius: var(--radius);
  }

  .msg.error {
    display: flex;
    gap: 10px;
  }

  .msg.error .bubble {
    background: #f3ded9;
    border: 1px solid var(--error);
    color: var(--error);
    padding: 10px 14px;
    border-radius: var(--radius);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
  }

  .typing span {
    width: 5px;
    height: 5px;
    background: var(--leaf-deep);
    border-radius: 50%;
    animation: blink 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) {
    animation-delay: 0.15s;
  }
  .typing span:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes blink {
    0%, 80%, 100% {
      opacity: 0.3;
    }
    40% {
      opacity: 1;
    }
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 16px 28px 20px;
    border-top: 1px solid var(--furrow);
    background: var(--paper);
  }

  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--furrow);
    border-radius: var(--radius);
    background: #fff;
    font-family: "Karla", sans-serif;
    font-size: 14.5px;
    color: var(--soil);
    padding: 10px 12px;
    max-height: 120px;
    line-height: 1.5;
  }

  textarea:focus {
    outline: none;
    border-color: var(--leaf);
  }

  textarea::placeholder {
    color: var(--soil-soft);
    opacity: 0.75;
  }

  button {
    font-family: "Zilla Slab", serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--leaf);
    color: #fff;
    border: none;
    padding: 11px 20px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover:not(:disabled) {
    background: var(--leaf-deep);
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .chat::-webkit-scrollbar {
    width: 8px;
  }
  .chat::-webkit-scrollbar-thumb {
    background: var(--furrow);
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .typing span {
      animation: none;
    }
  }

  @media (max-width: 480px) {
    header, .intro-strip, .chat, form {
      padding-left: 18px;
      padding-right: 18px;
    }
  }
</style>
</head>
<body>
  <div class="plot">
    <header>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20C4 12 9 6 18 5C18 13 13 18 4 20Z" fill="#fdfdf8" />
          <path d="M4 20C7 15 10 12 16 8" stroke="#33552a" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </div>
      <div class="titles">
        <h1>AgriMate</h1>
        <p>Agriculture &amp; Farming Study Assistant</p>
      </div>
    </header>

    <div class="intro-strip">
      Ask about crops, soil, irrigation, pests, livestock, or agriculture coursework.
    </div>

    <div class="chat" id="chat" aria-live="polite"></div>

    <form id="chat-form">
      <textarea
        id="input"
        rows="1"
        placeholder="e.g. Explain crop rotation, or help me revise soil pH concepts..."
        autofocus
      ></textarea>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");

    const leafSvg =
      '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M4 20C4 12 9 6 18 5C18 13 13 18 4 20Z" fill="#4c7a3d" />' +
      '<path d="M4 20C7 15 10 12 16 8" stroke="#faf6ea" stroke-width="1.3" stroke-linecap="round" />' +
      "</svg>";

    // Client-side history kept in memory only (role + text)
    const history = [];

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg " + role;

      if (role === "user") {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrapper.appendChild(bubble);
      } else {
        const mark = document.createElement("div");
        mark.className = role === "bot" ? "leaf-mark" : "";
        if (role === "bot") mark.innerHTML = leafSvg;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        if (role === "bot") wrapper.appendChild(mark);
        wrapper.appendChild(bubble);
      }

      chatEl.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function addTypingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.className = "msg bot";
      wrapper.id = "typing-indicator";

      const mark = document.createElement("div");
      mark.className = "leaf-mark";
      mark.innerHTML = leafSvg;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";
      bubble.appendChild(typing);

      wrapper.appendChild(mark);
      wrapper.appendChild(bubble);
      chatEl.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }

    inputEl.addEventListener("input", autoResize);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage("user", message);
      history.push({ role: "user", text: message });

      inputEl.value = "";
      autoResize();
      inputEl.disabled = true;
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: history.slice(0, -1), // prior turns, excluding the one just sent
          }),
        });

        const data = await res.json();
        removeTypingIndicator();

        if (!res.ok) {
          addMessage("error", data.error || "Something went wrong. Please try again.");
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "bot", text: data.reply });
        }
      } catch (err) {
        removeTypingIndicator();
        addMessage("error", "Could not reach the server. Please check your connection.");
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    // Greet the user on load
    addMessage(
      "bot",
      "Hi, I'm AgriMate. Ask me about crops, soil, irrigation, pests, livestock, or any agriculture study topic you're working through."
    );
  </script>
</body>
</html>
